services:
  bot:
    build: .
    container_name: chatbot-academia
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - evolution
      - postgres
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  evolution:
    # Confira a tag mais recente em hub.docker.com/r/evoapicloud/evolution-api antes de ir pra producao.
    # (a org antiga "atendai/evolution-api" nao aceita mais pull; o projeto migrou para evoapicloud).
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - SERVER_URL=https://${EVOLUTION_DOMAIN}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=false
      # Redis desativado: em servidores com pouca CPU/RAM, o cache Redis concorrendo com a
      # geracao de pre-keys do Baileys pode causar timeout (stream 515) e o WhatsApp derruba
      # o aparelho logo apos parear (erro 401 device_removed). Ver evolution-api#2437.
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1033773198
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    networks:
      - internal
      - web

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # So no loopback da propria VPS - nunca exposto pra internet. Acesso
      # externo (pgAdmin etc.) via tunel SSH: ssh -L 5433:localhost:5432 ...
      - "127.0.0.1:5432:5432"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  # Bot <-> Evolution <-> Postgres/Redis, sem sair do host.
  internal:
  # Apenas o Caddy e a Evolution ficam aqui (Evolution precisa de HTTPS publico p/ o manager/QR code).
  web:

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
